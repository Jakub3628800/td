---
# Pre-commit configuration generated by prec-hook-autodetect
# Technologies detected: go, markdown, yaml
# To install: pre-commit install
# To update: pre-commit autoupdate

repos:
  - repo: "https://github.com/pre-commit/pre-commit-hooks"
    rev: v5.0.0
    hooks:
      - id: "trailing-whitespace"
        args: ["--markdown-linebreak-ext=md"]
      - id: "end-of-file-fixer"
      - id: "check-yaml"
      - id: "check-added-large-files"
      - id: "check-merge-conflict"
      - id: "detect-private-key"
      - id: "check-case-conflict"
      - id: "check-executables-have-shebangs"
      - id: "check-toml"
      - id: "check-vcs-permalinks"

  - repo: "https://github.com/pre-commit/mirrors-prettier"
    rev: "v4.0.0-alpha.8"
    hooks:
      - id: prettier
        types: [markdown]
        name: "Format Markdown files"

  - repo: "https://github.com/adrienverge/yamllint"
    rev: v1.37.1
    hooks:
      - id: yamllint
        name: "Lint YAML files"

  - repo: "https://github.com/golangci/golangci-lint"
    rev: v1.64.8
    hooks:
      - id: "golangci-lint"
        name: "Lint Go code"

  - repo: "https://github.com/dnephin/pre-commit-golang"
    rev: v0.5.1
    hooks:
      - id: "go-fmt"
        name: "Format Go code"
      - id: "go-vet"
        name: "Check for Go code issues"
        #      - id: "go-imports"
        #        name: "Format Go imports"
        #      - id: "go-critic"
        #        name: "Additional Go linting"

  - repo: "https://github.com/igorshubovych/markdownlint-cli"
    rev: v0.45.0
    hooks:
      - id: markdownlint
        name: "Lint Markdown files"
