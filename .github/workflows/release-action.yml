name: Create Release

on:
  workflow_dispatch:
    inputs:
      version_type:
        description: 'Version type to bump (major, minor, patch)'
        required: true
        default: 'patch'
        type: choice
        options:
          - major
          - minor
          - patch
      prerelease:
        description: 'Mark as pre-release'
        required: true
        default: false
        type: boolean

jobs:
  bump-version:
    name: Bump Version
    runs-on: ubuntu-latest
    outputs:
      new_version: ${{ steps.extract_version.outputs.new_version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Git
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"

      - name: Bump version
        run: |
          ./scripts/bump-version.sh ${{ github.event.inputs.version_type }}
          git push

      - name: Extract new version
        id: extract_version
        run: |
          NEW_VERSION=$(grep -o '"[0-9]\+\.[0-9]\+\.[0-9]\+"' main.go | tr -d '"')
          echo "new_version=$NEW_VERSION" >> $GITHUB_OUTPUT

  test:
    name: Run Tests
    needs: bump-version
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: master

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'
          
      - name: Install golangci-lint
        run: go install github.com/golangci/golangci-lint/cmd/golangci-lint@latest
        
      - name: Run linters
        run: golangci-lint run ./...

      - name: Run tests
        run: go test -v ./...

  release:
    name: Create Release
    needs: [bump-version, test]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: master

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: Build release binaries
        run: make build-release

      - name: Create Release
        id: create_release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ needs.bump-version.outputs.new_version }}
          name: Release v${{ needs.bump-version.outputs.new_version }}
          draft: false
          prerelease: ${{ github.event.inputs.prerelease }}
          files: |
            bin/td-${{ needs.bump-version.outputs.new_version }}-linux-amd64
            bin/td-${{ needs.bump-version.outputs.new_version }}-darwin-amd64
            bin/td-${{ needs.bump-version.outputs.new_version }}-windows-amd64.exe
          token: ${{ secrets.GITHUB_TOKEN }} 