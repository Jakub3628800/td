---
name: Run Tests

on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - '*'
      - '!master'
    paths-ignore:
      - '**.md'
      - '.gitignore'

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.21'

      - name: Run tests
        run: go test -v ./...

      - name: Build
        run: go build -o bin/td main.go

