---
# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# https://docs.github.com/code-security/dependabot/
# dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  - package-ecosystem: "gomod"  # For Go modules
    directory: "/"              # Location of go.mod file
    schedule:
      interval: "weekly"
    # Optional: Add reviewers or assignees
    #   reviewers:
    #     - "your-team-name"

  - package-ecosystem: "github-actions"  # For GitHub Actions
    directory: "/"  # Location of workflow files (typically .github/workflows)
    schedule:
      interval: "weekly"
